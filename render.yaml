services:
  - type: web
    name: drishti-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DRISHTI_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: intent_drift_ai.db

static_sites:
  - name: drishti-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://drishti-api.onrender.com
